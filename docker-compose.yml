name: valenet-quality-hub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valenet_quality_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      POSTGRES_USER: ${POSTGRES_USER:-valenet}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-valenet} -d ${POSTGRES_DB:-valenet_quality_hub}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-valenet}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-valenet_quality_hub}?schema=public
      NODE_ENV: production
    ports:
      - '${BACKEND_PORT:-3001}:3001'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3001}/api/v1
      NODE_ENV: production
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  postgres_data:
